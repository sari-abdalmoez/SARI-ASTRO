name: Build SARI Astro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run native engine tests
        run: |
          cd sari/native
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -pthread \
            io/image.cpp \
            stars/stars.cpp \
            registration/registration.cpp \
            stacking/stacking.cpp \
            quality/quality.cpp \
            memory/budget.cpp \
            tests/test_main.cpp \
            -o /tmp/sari_tests
          /tmp/sari_tests

  android:
    needs: native-tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug and release
        working-directory: sari
        run: |
          gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify arm64-v8a native library
        working-directory: sari
        run: |
          for apk in \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
          do
            echo "== $apk"
            unzip -l "$apk" | grep "lib/arm64-v8a/libsari_jni.so" || {
              echo "libsari_jni.so missing from arm64-v8a"
              exit 1
            }
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sari-astro-apks
          path: sari/app/build/outputs/apk/**/*.apk
