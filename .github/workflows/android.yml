name: Build SARI Astro
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native tests with sanitizers
        run: |
          cd native
          g++ -std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -pthread \
            io/image.cpp stars/stars.cpp registration/registration.cpp stacking/stacking.cpp \
            quality/quality.cpp memory/budget.cpp pipeline/pipeline.cpp tests/test_main.cpp -o /tmp/sari_tests
          /tmp/sari_tests
  android:
    needs: native-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK, NDK, CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build exactly one release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Validate single APK, signature and arm64 native library
        run: |
          files=(app/build/outputs/apk/release/*.apk)
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "app/build/outputs/apk/release/app-release.apk"
          test "$(stat -c%s "${files[0]}")" -gt 1000000
          unzip -l "${files[0]}" | grep -E 'lib/arm64-v8a/libsari_jni.so$'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "${files[0]}"
      - name: Rename final APK
        run: cp app/build/outputs/apk/release/app-release.apk SARI-Astro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SARI-Astro-APK
          path: SARI-Astro.apk
          if-no-files-found: error
